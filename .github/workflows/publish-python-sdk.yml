name: Publish Python SDK

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Package index to publish to
        required: true
        type: choice
        options:
          - testpypi
          - none
        default: testpypi
  push:
    tags:
      - "polygres-sdk-v*"

permissions:
  contents: read

jobs:
  build:
    name: Validate and build SDK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and release dependencies
        run: python -m pip install -e ".[dev]" twine

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Check generated contracts and reference
        run: |
          python tools/generate_runtime_openapi_snapshot.py --check
          python tools/generate_sdk_method_spec.py --check
          python tools/generate_sdk_method_spec.py --validate-only

      - name: Verify release version and explicit compatibility baseline
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python tools/verify_release_version.py --tag "$GITHUB_REF_NAME"
            python tools/extract_release_notes.py \
              --version "${GITHUB_REF_NAME#polygres-sdk-v}" \
              --output "$RUNNER_TEMP/github-release-notes.md"
          else
            python tools/verify_release_version.py
          fi
          python tools/check_sdk_compatibility.py \
            --baseline compatibility/0.2.1/python-sdk-v1.methods.json

      - name: Build SDK distribution
        run: |
          rm -rf dist
          python -m build
          python -m twine check dist/*
          python tools/verify_distribution.py dist/*.whl dist/*.tar.gz

      - name: Verify clean wheel installation
        run: |
          smoke_dir="$RUNNER_TEMP/polygres-sdk-release-smoke"
          python -m venv "$smoke_dir"
          "$smoke_dir/bin/python" -m pip install dist/*.whl
          "$smoke_dir/bin/python" - <<'PY'
          import importlib.metadata
          import json
          from importlib.resources import files
          from polygres import __version__

          assert __version__ == importlib.metadata.version("polygres-sdk")
          for name in (
              "runtime-v1.openapi.json",
              "python-sdk-v1.methods.json",
              "python-sdk-v1.methods.schema.json",
          ):
              json.loads(files("polygres.spec").joinpath(name).read_text())
          assert files("polygres").joinpath("migrations", "README.md").is_file()
          PY

      - name: Verify clean source distribution installation
        run: |
          smoke_dir="$RUNNER_TEMP/polygres-sdk-release-sdist-smoke"
          python -m venv "$smoke_dir"
          "$smoke_dir/bin/python" -m pip install dist/*.tar.gz
          "$smoke_dir/bin/python" - <<'PY'
          import importlib.metadata
          import json
          from importlib.resources import files
          from polygres import __version__

          assert __version__ == importlib.metadata.version("polygres-sdk")
          for name in (
              "runtime-v1.openapi.json",
              "python-sdk-v1.methods.json",
              "python-sdk-v1.methods.schema.json",
          ):
              json.loads(files("polygres.spec").joinpath(name).read_text())
          assert files("polygres").joinpath("migrations", "README.md").is_file()
          PY

      - name: Upload SDK distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish SDK to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/polygres-sdk/
    permissions:
      id-token: write
    steps:
      - name: Download SDK distributions
        uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish SDK to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/polygres-sdk-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/polygres-sdk/
    permissions:
      id-token: write
    steps:
      - name: Download SDK distributions
        uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-github-release:
    name: Create GitHub Release
    needs: publish-pypi
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/polygres-sdk-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download SDK distributions
        uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist/

      - name: Prepare release metadata
        id: release
        run: |
          version="${GITHUB_REF_NAME#polygres-sdk-v}"
          notes_file="$RUNNER_TEMP/github-release-notes.md"
          python tools/extract_release_notes.py \
            --version "$version" \
            --output "$notes_file"
          echo "title=Polygres SDK $version" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --verify-tag \
              --latest \
              --draft=false \
              --prerelease=false \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES_FILE"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --latest \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES_FILE"
          fi

      - name: Verify latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$latest_tag" != "$GITHUB_REF_NAME" ]; then
            echo "Latest GitHub Release is $latest_tag, expected $GITHUB_REF_NAME."
            exit 1
          fi
