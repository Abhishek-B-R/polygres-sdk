[project]
name = "polygres-sdk"
version = "0.2.1"
description = "Python SDK for Polygres"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Polygres" }
]
maintainers = [
  { name = "Polygres", email = "support@polygres.com" }
]
keywords = [
  "polygres",
  "postgres",
  "postgresql",
  "vector-search",
  "graph-search",
  "retrieval",
  "hybrid-search"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = ["httpx>=0.28.1", "pydantic>=2.7,<3"]

[project.urls]
Homepage = "https://polygres.com"
Documentation = "https://docs.polygres.com/sdk"
Repository = "https://github.com/Evokoa/polygres-sdk"
Changelog = "https://github.com/Evokoa/polygres-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/Evokoa/polygres-sdk/issues"
Support = "https://polygres.com"

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "hatchling>=1.26.3",
  "jsonschema>=4.23,<5",
  "pytest>=8.3.4",
  "respx>=0.21.1",
  "ruff>=0.8.4",
  "tomli>=2.0.1; python_version < '3.11'"
]

[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polygres"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "polygres/migrations"

[tool.hatch.build.targets.sdist]
include = [
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/compatibility",
  "/docs",
  "/migrations",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/tools",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "heavy: opt-in tests that require an installed wheel or live staging services",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
